services:
  postgres:
    image: postgres:16-alpine
    container_name: marpol_ppm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marpol}
      # UYARI: asagidaki varsayilan yalnizca yerel gelistirme icindir.
      # Uretimde POSTGRES_PASSWORD ortam degiskenini mutlaka tanimlayin.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marpol}
      POSTGRES_DB: ${POSTGRES_DB:-marpol_ppm}
      TZ: Europe/Istanbul
    ports:
      # Yalnizca bu makineden erisilebilir. "5433:5432" yazilirsa veritabani
      # tum yerel aga (0.0.0.0) acilir.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - marpol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marpol} -d ${POSTGRES_DB:-marpol_ppm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marpol_pgdata:
