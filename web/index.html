<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Oturum anahtari localStorage'da tutuldugu icin XSS'e karsi ana telafi
      kontrolu budur: disaridan script yuklenmesini ve inline script
      calistirilmasini engeller. style-src'de 'unsafe-inline' gerekli, cunku
      SAP UI5 Web Components stillerini calisma aninda enjekte ediyor.
      Not: frame-ancestors meta etiketinde yok sayilir; clickjacking korumasi
      sunucudaki helmet basligiyla saglanir.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self' data:;
               media-src 'self';
               connect-src 'self' ws: wss:;
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="/marpol.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marpol | Üretim Yönetim Sistemi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
